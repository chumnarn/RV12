VERILOG_DEFINES:
  - USE_POWER_PINS
  - SYNTHESIS

# Better SystemVerilog/package handling for RV12.
USE_SLANG: true
SLANG_ARGUMENTS:
  - --keep-hierarchy

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

VDD_NETS: [VDD]
GND_NETS: [VSS]

CLOCK_PORT: clk_PAD
CLOCK_NET: u_clk_pad/p2c
CLOCK_PERIOD: 20.0

# Conservative first-pass die. Resize after synthesis/PPA.
FP_SIZING: absolute
DIE_AREA: [0, 0, 2200, 2200]
CORE_AREA: [420, 420, 1780, 1780]
PL_TARGET_DENSITY_PCT: 30
GRT_ALLOW_CONGESTION: true

# Pad order
PAD_SOUTH:
  - u_clk_pad
  - u_rst_pad
  - "g_in\\[0\\].u_pad"
  - "g_in\\[1\\].u_pad"
  - "g_in\\[2\\].u_pad"
  - "g_in\\[3\\].u_pad"

PAD_EAST:
  - "g_in\\[4\\].u_pad"
  - "g_in\\[5\\].u_pad"
  - "g_in\\[6\\].u_pad"
  - "g_in\\[7\\].u_pad"
  - u_vdd

PAD_NORTH:
  - "g_out\\[7\\].u_pad"
  - "g_out\\[6\\].u_pad"
  - "g_out\\[5\\].u_pad"
  - "g_out\\[4\\].u_pad"
  - u_iovdd

PAD_WEST:
  - "g_out\\[3\\].u_pad"
  - "g_out\\[2\\].u_pad"
  - "g_out\\[1\\].u_pad"
  - "g_out\\[0\\].u_pad"
  - u_vss
  - u_iovss

PDN_CORE_RING: true
PDN_CORE_RING_VWIDTH: 15
PDN_CORE_RING_HWIDTH: 15
PDN_CORE_RING_VSPACING: 5
PDN_CORE_RING_HSPACING: 5
PDN_CORE_RING_CONNECT_TO_PADS: true
PDN_ENABLE_PINS: false

PAD_BONDPAD_NAME: bondpad_70x70_novias

EXTRA_GDS:
  - dir::../ip/bondpad_70x70_novias/gds/bondpad_70x70_novias.gds

EXTRA_LEFS:
  - dir::../ip/bondpad_70x70_novias/lef/bondpad_70x70_novias.lef

IGNORE_DISCONNECTED_MODULES:
  - bondpad_70x70_novias

MAGIC_EXT_UNIQUE: notopports
